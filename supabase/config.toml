# Supabase local development config. Managed by the Supabase CLI.
# Run `supabase start` to spin up the local stack (requires Docker).
project_id = "nalvita"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
# Sessions stay active for 30 days unless the user logs out.
jwt_expiry = 3600

[auth.rate_limit]
# Failed sign-in code entries: 5 verification attempts per 5-minute window,
# then further tries are blocked. Closest free-tier equivalent to
# "5 wrong codes locks you out for 10 minutes" (the window length is fixed).
token_verifications = 5

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
# A sign-in link stays valid for 10 minutes.
otp_expiry = 600
# At most one sign-in email per minute per address.
max_frequency = "1m0s"

# signInWithOtp (passwordless) uses the magic-link template — a click-to-sign-in
# link. The hosted project can't customize templates without paid custom SMTP,
# so prod uses Supabase's default magic-link email; this keeps local matching.
[auth.email.template.magic_link]
subject = "Your Nalvita sign-in link"
content_path = "./supabase/templates/magic_link.html"

# Google OAuth. Local dev needs the env vars from .env.example in your shell;
# the cloud project is configured in Dashboard → Authentication → Providers.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[storage]
enabled = true
file_size_limit = "20MiB"
