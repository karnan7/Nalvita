name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # A typecheck cannot tell you whether Metro can resolve the workspace
      # packages through their symlinks — only a real bundle can. Kept separate
      # from `build` so Vercel and the Sonar workflow stay fast.
      - name: Bundle the mobile app (Metro resolution check)
        run: npm run bundle
        env:
          # The app throws without these; the bundle never contacts Supabase.
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key

  db-tests:
    name: RLS tests (pgTAP + integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase (applies all migrations)
        run: supabase start
        env:
          # Dummy values so config.toml's env() substitution resolves in CI;
          # no test exercises the Google OAuth flow itself.
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-dummy-client-id
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-dummy-secret

      - name: Run pgTAP suite
        run: supabase test db

      - name: Build packages
        run: npm run build

      # Edge Functions are not part of `supabase start`. Without this the
      # send-notification suite would skip itself and CI would report green
      # while testing nothing. --no-verify-jwt leaves the platform gate off so
      # the function's own service-key check is what the tests exercise.
      - name: Serve Edge Functions
        run: supabase functions serve --no-verify-jwt &

      - name: Wait for Edge Functions to answer
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST               http://127.0.0.1:54321/functions/v1/send-notification               -H 'Content-Type: application/json' -d '{}' || true)
            if [ "$code" = "403" ]; then echo "Edge Functions ready"; exit 0; fi
            sleep 2
          done
          echo "Edge Functions did not come up" >&2
          exit 1

      - name: Run RLS integration suite
        run: npm run test:integration
