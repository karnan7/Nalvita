# Supabase free tier pauses projects after 7 days of inactivity.
# This weekly ping keeps the project awake as insurance.
# Requires the SUPABASE_URL and SUPABASE_ANON_KEY repo secrets;
# the job is skipped silently until they are configured.
name: Supabase keepalive

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not configured; skipping ping."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/" > /dev/null
          echo "Supabase pinged successfully."
