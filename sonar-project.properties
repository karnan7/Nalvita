# SonarQube Cloud (SonarCloud) configuration — see KAR-31.
#
# Analysis is CI-based (GitHub Actions), NOT SonarCloud "Automatic Analysis".
# The two are mutually exclusive: after importing the project, disable
# Automatic Analysis in SonarCloud → Project → Administration → Analysis Method,
# otherwise CI scans fail with "Automatic Analysis is enabled".
#
# projectKey / organization below are SonarCloud's default naming when a repo is
# imported from GitHub (<org>_<repo> and the org login). Confirm they match what
# SonarCloud actually created and adjust if not.
sonar.projectKey=karnan7_Nalvita
sonar.organization=karnan7

# Analyse app source only; build output, deps, and generated files are excluded.
sonar.sources=packages/core/src,packages/data/src,packages/web/src
sonar.tests=packages/core/src,packages/data/src,packages/web/src,packages/integration-tests/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Coverage: each package emits lcov via Vitest (v8 provider). Paths are relative
# to this file at the repo root.
sonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/data/coverage/lcov.info,packages/web/coverage/lcov.info

# Never analyse build output, deps, or generated declaration files.
sonar.exclusions=**/dist/**,**/node_modules/**,**/*.d.ts

# Files that exist only to test or configure — real, but not meaningful to cover.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/test/**,packages/integration-tests/**,**/*.config.*,packages/web/src/main.tsx

sonar.sourceEncoding=UTF-8
