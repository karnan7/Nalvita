<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nalvita — Personal Health Records</title>
    <link rel="icon" type="image/png" href="/favicon-light.png" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      // Theme preference is not health data, so localStorage is acceptable here.
      (function () {
        try {
          var pref = localStorage.getItem('nalvita-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (pref === 'dark' || ((!pref || pref === 'system') && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (err) {
          // Best-effort only; the ThemeProvider re-applies the theme on mount.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
