# Supabase local development config. Managed by the Supabase CLI.
# Run `supabase start` to spin up the local stack (requires Docker).
project_id = "nalvita"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
# Sessions stay active for 30 days unless the user logs out.
jwt_expiry = 3600

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "20MiB"
